<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- ไอคอนแบรนด์ ShopDash: ถุงช้อปปิ้งทรงคางหมู (ทรงเดียวกับ BagIcon ใน component library)
       + เส้น dash สีเหลืองสื่อความเร็ว บนพื้น indigo สีแบรนด์แพลตฟอร์ม
       Next.js เสิร์ฟไฟล์นี้เป็น favicon อัตโนมัติ (app/icon.svg) — png/ico สร้างจากไฟล์นี้
       ด้วย scripts/gen-brand-icon.mjs -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#g)"/>
  <!-- หูถุง (ส่วนที่โผล่เหนือปากถุง) -->
  <path d="M212 206 v-32 a44 44 0 0 1 88 0 v32" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>
  <!-- ตัวถุงทรงคางหมู ปากแคบก้นกว้างเล็กน้อย -->
  <path d="M176 196 h160 l30 188 a30 30 0 0 1 -29.8 34 H175.8 a30 30 0 0 1 -29.8 -34 z" fill="#ffffff"/>
  <!-- เส้น dash ชิดซ้าย (ความเร็ว) -->
  <rect x="192" y="300" width="100" height="28" rx="14" fill="#f59e0b"/>
  <rect x="192" y="342" width="62" height="28" rx="14" fill="#f59e0b"/>
</svg>
