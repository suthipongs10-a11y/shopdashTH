# /etc/nginx/sites-available/crown.conf - Ashen Crown web build at crown.ragalpha.com.
# Serves ONLY /srv/crown/www. Traffic arrives through Cloudflare (orange cloud); the
# certificate below is a Cloudflare Origin Certificate (SSL mode: Full (strict)).

server {
    listen 80;
    listen [::]:80;
    server_name crown.ragalpha.com;
    return 301 https://$host$request_uri;
}

server {
    # "listen ... ssl http2" is the form nginx 1.24 (Ubuntu 24.04) understands.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crown.ragalpha.com;

    ssl_certificate     /etc/ssl/crown/origin.pem;
    ssl_certificate_key /etc/ssl/crown/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    root /srv/crown/www;
    index index.html;
    autoindex off;
    disable_symlinks on;
    server_tokens off;

    access_log /var/log/nginx/crown.access.log;
    error_log  /var/log/nginx/crown.error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Every file is checked for changes on each visit (cheap 304 replies), so a new build
    # shows up right away while unchanged files are not downloaded again.
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/wasm application/octet-stream
               image/svg+xml;

    # Nothing hidden (.git, .env, ...) and only the files of the game build.
    location ~ /\. {
        deny all;
    }
    location ~* \.wasm$ {
        types { }
        default_type application/wasm;
        try_files $uri =404;
    }
    location ~* \.pck$ {
        types { }
        default_type application/octet-stream;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
