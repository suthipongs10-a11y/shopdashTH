# /etc/nginx/conf.d/00-deny-unknown.conf - requests for any other hostname (or the bare IP)
# get no content: plain HTTP is closed, HTTPS handshakes are refused.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
